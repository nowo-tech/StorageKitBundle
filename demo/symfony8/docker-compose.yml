name: storage-kit-bundle-demo-symfony-8
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-kit-demo-symfony8-php
    working_dir: /app
    restart: unless-stopped
    ports:
      # Loopback only: the demo users and the S3 credentials below are throw-away development values.
      - "127.0.0.1:${PORT:-8213}:80"
    volumes:
      - .:/app
      - ../..:/var/storage-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - LOCK_DSN=${LOCK_DSN:-flock}
      - DATABASE_URL=${DATABASE_URL:-mysql://storagekit:storagekit@db:3306/storage_kit_demo?serverVersion=8.0&charset=utf8mb4}
      - DEMO_S3_ENDPOINT=${DEMO_S3_ENDPOINT:-http://rustfs:9000}
      - DEMO_S3_ACCESS_KEY=${DEMO_S3_ACCESS_KEY:-demo-access-key}
      - DEMO_S3_SECRET_KEY=${DEMO_S3_SECRET_KEY:-demo-secret-key-not-real}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - storage-kit-demo-network

  db:
    image: mysql:8.0
    container_name: storage-kit-demo-symfony8-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: storage_kit_demo
      MYSQL_USER: storagekit
      MYSQL_PASSWORD: storagekit
    volumes:
      - mysql_data:/var/lib/mysql
    # REQ-DEMO-006: no host port — access only via the Docker network.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustoragekit", "-pstoragekit"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - storage-kit-demo-network

  # S3-compatible object storage of the demo (RustFS: MinIO no longer publishes container images). No host port: the
  # demo buckets are private and every download goes through the application (SSRF allow-list: endpoints.allowed_hosts).
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: storage-kit-demo-symfony8-rustfs
    environment:
      # Obviously fake development credentials (not secrets).
      RUSTFS_ACCESS_KEY: ${DEMO_S3_ACCESS_KEY:-demo-access-key}
      RUSTFS_SECRET_KEY: ${DEMO_S3_SECRET_KEY:-demo-secret-key-not-real}
      RUSTFS_REGION: us-east-1
    expose:
      - "9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - storage-kit-demo-network

volumes:
  composer-cache:
  mysql_data:
  rustfs_data:

networks:
  storage-kit-demo-network:
    driver: bridge
