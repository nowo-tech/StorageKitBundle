security:
    password_hashers:
        # Demo only: plaintext passwords of throw-away users (the demo is bound to 127.0.0.1).
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext

    providers:
        demo_users:
            memory:
                users:
                    admin: { password: 'demo', roles: ['ROLE_ADMIN', 'ROLE_USER'] }
                    alice: { password: 'demo', roles: ['ROLE_USER'] }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js)/
            security: false
        main:
            lazy: true
            provider: demo_users
            http_basic:
                realm: 'Storage Kit demo (admin / demo, alice / demo)'

    # The instance Storage / Move pages need ROLE_ADMIN (nowo_storage_kit.security.access_roles); the host protects
    # the prefix as well. Notes, uploads and downloads need a signed-in user; the file context decides the rest.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/notes, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser: plaintext
