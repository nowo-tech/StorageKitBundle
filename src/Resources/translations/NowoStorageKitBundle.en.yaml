        bucket: 'Use 3 to 63 lowercase letters, digits, dots and dashes.'
        prefix: 'Use letters, digits, slashes and !_.*''()- only, without "." or ".." folders.'
        access_key: 'The access key must not contain spaces or control characters.'
        secret: 'The secret key must not contain control characters.'
        endpoint_invalid: 'Use an http(s) address such as https://s3.example.com, without path, query or credentials.'
        endpoint_not_allowed: 'This address is not allowed: private, local and cloud-metadata hosts are refused.'
