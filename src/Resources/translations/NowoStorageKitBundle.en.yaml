    config_invalid: 'not usable: check the configuration'
    action:
        save: 'Save'
        test: 'Test connection'
        move: 'Move to another bucket'
    flash:
        saved: 'The storage settings were saved.'
    section:
        config: 'Configuration'
    field:
        config_profile: 'Profile'
        delivery: 'Downloads'
status:
    on: 'Uploads on'
    off: 'Uploads off'
