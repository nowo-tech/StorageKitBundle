    help:
        enabled: 'Needs a bucket, an access key and a secret key.'
        endpoint: 'Leave empty for AWS S3. Other services: https://host[:port] (no path).'
        endpoint_restricted: 'Leave empty for AWS S3. Other services: https://host[:port]. Private, local and cloud-metadata addresses are refused.'
